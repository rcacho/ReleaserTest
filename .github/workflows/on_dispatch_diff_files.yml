name: Dispatch file diff

on: workflow_dispatch

jobs:
  diff_files:
    runs-on: ubuntu-latest
    env:
      FILE_JSON: |
        [
          {
            "filepath": "resources/example.json",
            "is_prod": false
          },
          {
            "filepath": "resources/other.json",
            "is_prod": true
          }
        ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch base
        run: git fetch origin main
      - name: Install json-diff
        run: npm install -g json-diff
      - name: Collect diffs
        id: collect_diffs
        run: |
          blocks="[]"

          while read -r item; do
            filepath=$(echo "$item" | jq -r '.filepath')

            cp "$filepath" "$filepath.pr"
            git show "origin/main:$filepath" > "$filepath.base"

            diff=$(json-diff "$filepath.base" "$filepath.pr" || true)
            escaped=$(jq -Rn --arg text "$diff" '$text')

            if [ -n "$escaped" ]; then
              block=$(jq -n --arg f "$filepath" --arg d "$escaped" '{type:"section", text:{type:"mrkdwn", text:("*" + $f + "*\n```" + $d + "```")}}}')
              blocks=$(echo "$blocks" | jq ". + [$block]")
            fi
          done <<< "$(echo "$FILES_JSON" | jq -c '.[]')"

          slack_message=$(jq -n --argjson blocks "$blocks" --arg pr "#files changed" \
              '{text:$pr, blocks:$blocks}')

          echo "slack_message=$slack_message" >> $GITHUB_OUTPUT
      - name: Send release info
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEB_HOOK }}
          webhook-type: incoming-webhook
          payload: |
            text: 'File Changed [${{ inputs.file-path }}]'
            attachments:
              - color: "#2c5f34"
                blocks: ${{ steps.collect_diffs.outputs.slack_message }}
